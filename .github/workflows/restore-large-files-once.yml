name: restore-large-files-once
on:
  push:
    branches:
      - cursor/ci-error-tracking-0c0a
    paths:
      - ".github/workflows/restore-large-files-once.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore whatsapp.ts and api.ts from main, apply error-tracker patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- server/whatsapp.ts server/api.ts
          patch -p1 < .github/patches/error-tracker-whatsapp-api.patch
          test "$(git hash-object server/whatsapp.ts)" = "e3a7ed403445ae1370f2cace08c6fa8f4f49c66b"
          test "$(git hash-object server/api.ts)" = "1f01ba532ba1c0b5c9283953732122a7f0256fa8"
          rm -f .github/workflows/restore-large-files-once.yml
          rm -f .github/patches/error-tracker-whatsapp-api.patch
          rmdir .github/patches 2>/dev/null || true
          git add -A
          git status
          git commit -m "Restore server/whatsapp.ts and server/api.ts with error-tracker instrumentation."
          git push
