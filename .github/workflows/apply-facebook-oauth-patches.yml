name: apply-facebook-oauth-patches
on:
  push:
    paths:
      - .github/workflows/apply-facebook-oauth-patches.yml
      - patches/facebook-oauth-api.ts.patch
      - patches/facebook-oauth-LoginPage.tsx.patch
      - patches/facebook-oauth-facebook-oauth.ts.patch
      - patches/facebook-oauth-env.example.patch
      - patches/facebook-oauth-firebase-docs.patch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: cursor/facebook-oauth-complete-0c0a
      - name: Apply Facebook OAuth patches and verify git blob SHAs
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import hashlib
          import subprocess

          def blob(path: str) -> str:
              b = Path(path).read_bytes()
              return hashlib.sha1(b"blob %d\0" % len(b) + b).hexdigest()

          patches = [
              ("patches/facebook-oauth-api.ts.patch", "server/api.ts", "df06a6d0c1a434dfe5fb66d3c8ffe65f02d0eda6"),
              ("patches/facebook-oauth-LoginPage.tsx.patch", "src/pages/LoginPage.tsx", "19a7cfc9b7d6188adb3a89d76b593842d363d5bd"),
              ("patches/facebook-oauth-facebook-oauth.ts.patch", "server/facebook-oauth.ts", "a4b69ab594c8bf3d0b2a6a9ff1fbca7a801e5846"),
              ("patches/facebook-oauth-env.example.patch", ".env.example", "c39bcd28cab5fa5e22504583085e1e354e3e21b4"),
              ("patches/facebook-oauth-firebase-docs.patch", "docs/FIREBASE_CLOUD_RUN_DEPLOY.md", "6e630a94869e7f8cced49a8a9f6cd71539f7dd69"),
          ]
          for patch, path, exp in patches:
              cur = blob(path)
              print("before", path, cur)
              if cur == exp:
                  print("skip already at target", path)
                  continue
              r = subprocess.run(["git", "apply", "--whitespace=nowarn", patch], capture_output=True, text=True)
              if r.returncode != 0:
                  print(r.stdout)
                  print(r.stderr)
                  raise SystemExit(f"git apply failed for {patch}")
              got = blob(path)
              print("after", path, "bytes", Path(path).stat().st_size, "gitblob", got)
              if got != exp:
                  raise SystemExit(f"SHA mismatch {path}: {got} != {exp}")
          PY2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/api.ts src/pages/LoginPage.tsx server/facebook-oauth.ts .env.example docs/FIREBASE_CLOUD_RUN_DEPLOY.md
          git rm -f \
            patches/facebook-oauth-api.ts.patch \
            patches/facebook-oauth-LoginPage.tsx.patch \
            patches/facebook-oauth-facebook-oauth.ts.patch \
            patches/facebook-oauth-env.example.patch \
            patches/facebook-oauth-firebase-docs.patch \
            .github/workflows/apply-facebook-oauth-patches.yml
          git commit -m "Complete Meta Facebook Login OAuth 2.0 (full api.ts, LoginPage.tsx, facebook-oauth.ts)."
          git push origin HEAD:cursor/facebook-oauth-complete-0c0a
