name: assemble-facebook-oauth-test
on:
  push:
    paths:
      - .github/workflows/assemble-facebook-oauth-test.yml
      - parts/facebook-oauth.test.ts.part0
      - parts/facebook-oauth.test.ts.part1
      - parts/facebook-oauth.test.ts.part2
      - parts/facebook-oauth.test.ts.part3
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: cursor/facebook-oauth-complete-0c0a
      - name: Concatenate parts and verify git blob SHA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          parts = [Path(f"parts/facebook-oauth.test.ts.part{i}").read_bytes() for i in range(4)]
          data = b"".join(parts)
          Path("server/facebook-oauth.test.ts").write_bytes(data)
          blob = hashlib.sha1(b"blob %d\0" % len(data) + data).hexdigest()
          print("bytes", len(data), "gitblob", blob)
          assert blob == "bd4380b0e913295ae1fef60e8ed22350344bf493", blob
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/facebook-oauth.test.ts
          git rm -f \
            parts/facebook-oauth.test.ts.part0 \
            parts/facebook-oauth.test.ts.part1 \
            parts/facebook-oauth.test.ts.part2 \
            parts/facebook-oauth.test.ts.part3 \
            .github/workflows/assemble-facebook-oauth-test.yml
          git commit -m "Add server/facebook-oauth.test.ts (full 17599-byte blob)."
          git push origin HEAD:cursor/facebook-oauth-complete-0c0a
