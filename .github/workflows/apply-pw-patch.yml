name: apply-pw-patch
on:
  push:
    paths:
      - .github/workflows/apply-pw-patch.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: cursor/ambient-scribe-rx-0c0a
      - name: Apply all-practices patch to PrescriptionWriter.tsx
        run: |
          set -euo pipefail
          git apply --whitespace=nowarn patches/prescription-writer-all-practices.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PrescriptionWriter.tsx
          git rm -f patches/prescription-writer-all-practices.patch .github/workflows/apply-pw-patch.yml
          git commit -m "feat(scribe): PrescriptionWriter all-practices blank Rx until capture"
          git push origin HEAD:cursor/ambient-scribe-rx-0c0a
