# Required status check on main: "lint-and-test"
# (lint + unit/integration tests + production build). See docs/BRANCH_PROTECTION.md.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: test-jwt-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint (tsc --noEmit)
        run: npm run lint

      # package.json "test" script — unit + integration. A failing step fails the workflow.
      - name: Test
        run: npm run test

      # Production Vite + esbuild bundle. Must pass before merge to main.
      - name: Build
        run: npm run build
