name: assemble-ci-merge-parts
on:
  push:
    branches:
      - cursor/ci-error-tracking-merge-0c0a

permissions:
  contents: write

concurrency:
  group: assemble-ci-merge-parts
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'waitFor')
    steps:
      - name: Checkout merge branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: cursor/ci-error-tracking-merge-0c0a
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble whatsapp.ts and api.ts
        run: |
          set -euo pipefail
          if [ ! -f .merge-parts/api.12 ]; then
            echo "Not all api parts present; skip assemble."
            exit 0
          fi
          git fetch origin cursor/ci-error-tracking-0c0a
          git checkout origin/cursor/ci-error-tracking-0c0a -- server/whatsapp.ts
          cat .merge-parts/api.00 .merge-parts/api.01 .merge-parts/api.02 .merge-parts/api.03 .merge-parts/api.04 .merge-parts/api.05 .merge-parts/api.06 .merge-parts/api.07 .merge-parts/api.08 .merge-parts/api.09 .merge-parts/api.10 .merge-parts/api.11 .merge-parts/api.12 > server/api.ts
          test "$(git hash-object server/whatsapp.ts)" = "e3a7ed403445ae1370f2cace08c6fa8f4f49c66b"
          test "$(git hash-object server/api.ts)" = "2a5ee5d41bd5525e2bcf291f4b9ee920de630914"
          rm -rf .merge-parts
          rm -f server/.sha-concat-test.txt
          rm -f .github/workflows/assemble-ci-merge-parts.yml
          git add -A
          git status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Merge CI gating and GCP Error Reporting onto main (resolve cloudbuild waitFor + keep HMAC data-deletion handler)."
          git push origin HEAD:cursor/ci-error-tracking-merge-0c0a
