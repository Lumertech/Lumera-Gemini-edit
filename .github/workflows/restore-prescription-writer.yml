name: restore-prescription-writer
on:
  push:
    paths:
      - .github/workflows/restore-prescription-writer.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: cursor/ambient-scribe-rx-0c0a
      - name: Restore PrescriptionWriter.tsx from blob 455e143
        run: |
          set -euo pipefail
          git checkout 1271f91b77b7b518127b031a5f68713f68ed7693 -- src/components/PrescriptionWriter.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PrescriptionWriter.tsx
          git rm -f .github/workflows/restore-prescription-writer.yml
          git commit -m "restore: PrescriptionWriter.tsx from blob 455e143cdc576d85089161e6f5469299e3e1a830"
          git push origin HEAD:cursor/ambient-scribe-rx-0c0a
